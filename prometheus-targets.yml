---
- name: Copy template of Prometheus config
  hosts: localhost
  gather_facts: false
  vars:
    prometheus_project_dir: '/mnt/c/Users/Alex-PC/Downloads/projects/prometheus-project/work'
  tasks:
    - name: Copy Prometheus config
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: '{{ prometheus_project_dir }}/prometheus.yml'
        mode: "0644"
      notify: Restart Prometheus
  handlers:
    - name: Restart Prometheus
      ansible.builtin.command:
        cmd: docker compose restart prometheus
        chdir: '{{ prometheus_project_dir }}'
      changed_when: true
