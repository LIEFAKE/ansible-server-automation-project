---
# defaults file for roles/node_exporter
node_exporter_version: '1.8.2'
node_exporter_arch: 'amd64'
node_exporter_port: 9100
node_exporter_user: 'node_exporter'
node_exporter_bin_path: '/usr/local/bin'
node_exporter_url: 'https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}'
node_exporter_archive: 'node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz'
