# Three test "servers". Build + start:  docker compose up -d --build
#                        Stop:           docker compose down
#
#   host   SSH from WSL        node_exporter from WSL (after monitoring.yml)
#   web1   127.0.0.1:2221      127.0.0.1:9101
#   web2   127.0.0.1:2222      127.0.0.1:9102
#   db1    127.0.0.1:2223      127.0.0.1:9103
#
# privileged + host cgroup: needed so systemd can run inside the container.

name: ansible-lab

x-server: &server
  build: .
  image: ansible-lab-node
  privileged: true
  cgroup: host
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
  networks: [lab]

services:
  web1:
    <<: *server
    hostname: web1
    ports: ["127.0.0.1:2221:22", "127.0.0.1:9101:9100"]
  web2:
    <<: *server
    hostname: web2
    ports: ["127.0.0.1:2222:22", "127.0.0.1:9102:9100"]
  db1:
    <<: *server
    hostname: db1
    ports: ["127.0.0.1:2223:22", "127.0.0.1:9103:9100"]

networks:
  lab:
    name: ansible-lab
