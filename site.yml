---
- name: Base setting up server
  hosts: lab
  gather_facts: true
  become: true
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name: '{{ several_packages }}'
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Save kernel info
      ansible.builtin.command: uname -r
      register: kernel_info
      changed_when: false

    - name: Show kernel info
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} runs kernel {{ kernel_info.stdout }}, {{ ansible_facts['memtotal_mb'] }} MB RAM"

    - name: Create admin users
      ansible.builtin.user:
        name: '{{ item }}'
        groups: sudo
        append: true
      loop: '{{ admin_users }}'


    - name: Create deploy user
      ansible.builtin.user:
        name: '{{ app_user }}'
        shell: /bin/bash

    - name: SSH hardening
      ansible.builtin.copy:
        dest: '/etc/ssh/sshd_config.d/10-hardening.conf'
        content: |
          PasswordAuthentication no
          PermitRootLogin no
        validate: /usr/sbin/sshd -t -f %s
        mode: '0644'
      notify: SSH restart

  handlers:
    - name: SSH restart
      ansible.builtin.service:
        name: ssh
        state: restarted


- name: Web servers
  hosts: web
  gather_facts: false
  become: true
  tasks:
    - name: Make a dir
      ansible.builtin.file:
        path: '{{ app_dir }}'
        state: directory
        owner: '{{ app_user }}'
        mode: '0755'

    - name: Deploy app config from template
      ansible.builtin.template:
        src: templates/app.conf.j2
        dest: '{{ app_dir }}/app.conf'
        mode: '0644'
      notify: Restart app

    - name: Ansible note
      ansible.builtin.lineinfile:
        path: '{{ app_dir }}/notes.txt'
        line: managed by ansible
        create: true
        mode: '0644'
  handlers:
    - name: Restart app
      ansible.builtin.debug:
        msg: "Restarting app on {{ inventory_hostname }}"

- name: DB servers
  hosts: db
  gather_facts: false
  become: true
  tasks:
    - name: Install db packages
      ansible.builtin.apt:
        name: '{{ db_packages }}'
        state: present
        update_cache: true
        cache_valid_time: 3600
